<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planner de Estudos</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --accent: #2563eb;
        --accent-light: #eff6ff;
        --accent-muted: #bfdbfe;
        --danger: #dc2626;
        --danger-light: #fef2f2;
        --success: #16a34a;
        --success-light: #f0fdf4;
        --warn: #d97706;
        --warn-light: #fffbeb;
        --bg: #ffffff;
        --bg2: #f8fafc;
        --bg3: #f1f5f9;
        --text: #0f172a;
        --text2: #64748b;
        --text3: #94a3b8;
        --border: #e2e8f0;
        --border2: #cbd5e1;
        --radius: 10px;
        --radius-lg: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --bg2: #1e293b;
          --bg3: #1e293b;
          --text: #f1f5f9;
          --text2: #94a3b8;
          --text3: #64748b;
          --border: #1e293b;
          --border2: #334155;
          --accent-light: #1e3a5f;
          --accent-muted: #1e3a5f;
          --danger-light: #3b1515;
          --success-light: #14290f;
          --warn-light: #2d1f04;
        }
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg3);
        color: var(--text);
        min-height: 100vh;
        padding: 1.5rem;
      }
      .container {
        max-width: 860px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 1.25rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h1 i {
        font-size: 22px;
        color: var(--accent);
      }
      .app {
        border-radius: var(--radius-lg);
        overflow: hidden;
        border: 1px solid var(--border);
        background: var(--bg);
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        padding: 0 1rem;
        gap: 0;
      }
      .tab {
        padding: 12px 16px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border: none;
        background: none;
        color: var(--text2);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        transition:
          color 0.15s,
          border-color 0.15s;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .tab.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .tab i {
        font-size: 15px;
      }
      .panel {
        display: none;
        padding: 1.5rem;
        min-height: 460px;
      }
      .panel.active {
        display: block;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
        min-width: 120px;
      }
      .field label {
        font-size: 12px;
        color: var(--text2);
        font-weight: 500;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        padding: 8px 10px;
        font-size: 13px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg2);
        color: var(--text);
        font-family: inherit;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-light);
      }
      .field textarea {
        resize: vertical;
        min-height: 56px;
      }
      .btn {
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 500;
        border: 1px solid var(--border2);
        border-radius: var(--radius);
        cursor: pointer;
        background: transparent;
        color: var(--text);
        transition:
          background 0.1s,
          border-color 0.1s;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn:hover {
        background: var(--bg2);
      }
      .btn.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .btn.primary:hover {
        background: #1d4ed8;
      }
      .btn.danger {
        color: var(--danger);
        border-color: transparent;
      }
      .btn.danger:hover {
        background: var(--danger-light);
      }
      .btn.success {
        color: var(--success);
        border-color: transparent;
      }
      .btn.success:hover {
        background: var(--success-light);
      }
      .btn.small {
        padding: 4px 10px;
        font-size: 12px;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 8px;
      }
      .card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .card-body {
        flex: 1;
        min-width: 0;
      }
      .card-title {
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card-sub {
        font-size: 12px;
        color: var(--text2);
        margin-top: 2px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 500;
      }
      .badge.blue {
        background: var(--accent-light);
        color: var(--accent);
      }
      .badge.red {
        background: var(--danger-light);
        color: var(--danger);
      }
      .badge.green {
        background: var(--success-light);
        color: var(--success);
      }
      .badge.yellow {
        background: var(--warn-light);
        color: var(--warn);
      }
      .badge.gray {
        background: var(--bg3);
        color: var(--text2);
      }
      .empty {
        text-align: center;
        padding: 2.5rem;
        color: var(--text2);
        font-size: 13px;
      }
      .empty i {
        font-size: 36px;
        display: block;
        margin-bottom: 8px;
        opacity: 0.35;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
        gap: 10px;
        margin-bottom: 20px;
      }
      .metric {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px;
        text-align: center;
      }
      .metric-val {
        font-size: 26px;
        font-weight: 600;
        line-height: 1.1;
      }
      .metric-lbl {
        font-size: 11px;
        color: var(--text2);
        margin-top: 4px;
      }
      .metric.blue .metric-val {
        color: var(--accent);
      }
      .metric.green .metric-val {
        color: var(--success);
      }
      .metric.red .metric-val {
        color: var(--danger);
      }
      .metric.yellow .metric-val {
        color: var(--warn);
      }
      .section-title {
        font-size: 11px;
        font-weight: 600;
        color: var(--text3);
        margin: 16px 0 8px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .progress-bar {
        height: 6px;
        background: var(--bg3);
        border-radius: 3px;
        overflow: hidden;
        margin-top: 6px;
      }
      .progress-fill {
        height: 100%;
        border-radius: 3px;
        transition: width 0.4s;
      }
      .check-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 7px;
      }
      .check-item input[type="checkbox"] {
        width: 15px;
        height: 15px;
        accent-color: var(--accent);
        cursor: pointer;
        flex-shrink: 0;
      }
      .check-item label {
        font-size: 13px;
        cursor: pointer;
        flex: 1;
      }
      .check-item.done label {
        text-decoration: line-through;
        color: var(--text2);
      }
      .timer-box {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 1.5rem;
        text-align: center;
        margin-bottom: 1.25rem;
      }
      .timer-display {
        font-size: 52px;
        font-weight: 600;
        letter-spacing: 0.06em;
        margin: 8px 0;
        font-variant-numeric: tabular-nums;
      }
      .timer-label {
        font-size: 12px;
        color: var(--text2);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .timer-actions {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 12px;
      }
      .tag {
        display: inline-block;
        padding: 2px 7px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 500;
        margin-right: 4px;
        background: var(--accent-muted);
        color: var(--accent);
      }
      .divider {
        height: 1px;
        background: var(--border);
        margin: 14px 0;
      }
      .mat-row {
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      .mat-row:last-child {
        border-bottom: none;
      }
      .mat-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .mat-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1><i class="ti ti-books"></i>Planner de Estudos</h1>
      <div class="app">
        <div class="tabs">
          <button class="tab active" onclick="switchTab('agenda')">
            <i class="ti ti-calendar"></i>Agenda
          </button>
          <button class="tab" onclick="switchTab('provas')">
            <i class="ti ti-writing"></i>Provas
          </button>
          <button class="tab" onclick="switchTab('materias')">
            <i class="ti ti-books"></i>Matérias
          </button>
          <button class="tab" onclick="switchTab('pomodoro')">
            <i class="ti ti-clock"></i>Pomodoro
          </button>
          <button class="tab" onclick="switchTab('dashboard')">
            <i class="ti ti-chart-bar"></i>Resumo
          </button>
        </div>

        <!-- AGENDA -->
        <div id="tab-agenda" class="panel active">
          <div class="row">
            <div class="field" style="flex: 2; min-width: 160px">
              <label>Atividade</label
              ><input id="a-nome" placeholder="Ex: Lista de exercícios" />
            </div>
            <div class="field">
              <label>Matéria</label
              ><select id="a-mat">
                <option value="">Selecionar</option>
              </select>
            </div>
            <div class="field">
              <label>Data</label><input type="date" id="a-data" />
            </div>
            <div class="field">
              <label>Prioridade</label>
              <select id="a-prio">
                <option value="media">Média</option>
                <option value="alta">Alta</option>
                <option value="baixa">Baixa</option>
              </select>
            </div>
            <button class="btn primary" onclick="addAtividade()">
              <i class="ti ti-plus"></i>Adicionar
            </button>
          </div>
          <div class="divider"></div>
          <div id="lista-atividades" class="list"></div>
        </div>

        <!-- PROVAS -->
        <div id="tab-provas" class="panel">
          <div class="row">
            <div class="field" style="flex: 2; min-width: 160px">
              <label>Prova / Trabalho</label
              ><input id="p-nome" placeholder="Ex: Prova de Cálculo 2" />
            </div>
            <div class="field">
              <label>Matéria</label
              ><select id="p-mat">
                <option value="">Selecionar</option>
              </select>
            </div>
            <div class="field">
              <label>Data</label><input type="date" id="p-data" />
            </div>
            <div class="field">
              <label>Peso (%)</label
              ><input
                type="number"
                id="p-peso"
                min="0"
                max="100"
                placeholder="30"
              />
            </div>
            <button class="btn primary" onclick="addProva()">
              <i class="ti ti-plus"></i>Adicionar
            </button>
          </div>
          <div class="divider"></div>
          <div id="lista-provas" class="list"></div>
        </div>

        <!-- MATÉRIAS -->
        <div id="tab-materias" class="panel">
          <div class="row">
            <div class="field" style="flex: 2">
              <label>Nome da Matéria</label
              ><input id="m-nome" placeholder="Ex: Cálculo 2" />
            </div>
            <div class="field">
              <label>Cor</label>
              <select id="m-cor">
                <option value="blue">Azul</option>
                <option value="green">Verde</option>
                <option value="red">Vermelho</option>
                <option value="yellow">Amarelo</option>
                <option value="gray">Cinza</option>
              </select>
            </div>
            <div class="field">
              <label>Meta (h/semana)</label
              ><input
                type="number"
                id="m-meta"
                min="1"
                max="40"
                placeholder="5"
              />
            </div>
            <button class="btn primary" onclick="addMateria()">
              <i class="ti ti-plus"></i>Adicionar
            </button>
          </div>
          <div class="divider"></div>
          <p class="section-title">Horas estudadas hoje</p>
          <div id="lista-materias"></div>
        </div>

        <!-- POMODORO -->
        <div id="tab-pomodoro" class="panel">
          <div class="timer-box">
            <div class="timer-label" id="pomo-fase">Foco</div>
            <div class="timer-display" id="pomo-display">25:00</div>
            <div style="font-size: 12px; color: var(--text2)">
              Sessão <span id="pomo-sessao">1</span>/4
            </div>
            <div class="timer-actions">
              <button class="btn" onclick="pomoAjuste(-5)">-5min</button>
              <button class="btn primary" id="pomo-btn" onclick="pomoToggle()">
                <i class="ti ti-player-play"></i>Iniciar
              </button>
              <button class="btn" onclick="pomoAjuste(5)">+5min</button>
              <button class="btn" onclick="pomoReset()">
                <i class="ti ti-refresh"></i>Reset
              </button>
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label>Matéria atual</label
              ><select id="pomo-mat">
                <option value="">Nenhuma</option>
              </select>
            </div>
            <div class="field">
              <label>O que vai estudar?</label
              ><input
                id="pomo-tarefa"
                placeholder="Ex: Exercícios pág. 45-60"
              />
            </div>
          </div>
          <p class="section-title">Tarefas desta sessão</p>
          <div id="pomo-checklist"></div>
          <div class="row" style="margin-top: 8px">
            <input
              id="pomo-nova"
              style="
                flex: 1;
                padding: 8px 10px;
                font-size: 13px;
                border: 1px solid var(--border);
                border-radius: var(--radius);
                background: var(--bg2);
                color: var(--text);
                font-family: inherit;
              "
              placeholder="Adicionar tarefa..."
            />
            <button class="btn" onclick="addPomoTask()">
              <i class="ti ti-plus"></i>
            </button>
          </div>
        </div>

        <!-- DASHBOARD -->
        <div id="tab-dashboard" class="panel">
          <div class="metrics" id="dash-metrics"></div>
          <p class="section-title">Próximas provas</p>
          <div id="dash-provas"></div>
          <p class="section-title">Atividades pendentes</p>
          <div id="dash-ativ"></div>
          <p class="section-title">Horas por matéria</p>
          <div id="dash-materias"></div>
        </div>
      </div>
    </div>

    <script>
      const corMap = {
        blue: "#2563eb",
        green: "#16a34a",
        red: "#dc2626",
        yellow: "#d97706",
        gray: "#888",
      };
      let data = {
        materias: [],
        atividades: [],
        provas: [],
        pomoTasks: [],
        horasHoje: {},
      };
      try {
        const s = localStorage.getItem("estudo_data");
        if (s) data = JSON.parse(s);
      } catch (e) {}

      function save() {
        try {
          localStorage.setItem("estudo_data", JSON.stringify(data));
        } catch (e) {}
      }
      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      }

      function switchTab(t) {
        document.querySelectorAll(".tab").forEach((el, i) => {
          const tabs = [
            "agenda",
            "provas",
            "materias",
            "pomodoro",
            "dashboard",
          ];
          el.classList.toggle("active", tabs[i] === t);
        });
        document
          .querySelectorAll(".panel")
          .forEach((el) => el.classList.remove("active"));
        document.getElementById("tab-" + t).classList.add("active");
        if (t === "dashboard") renderDash();
      }

      function getMatOpts() {
        return data.materias
          .map((m) => `<option value="${m.id}">${m.nome}</option>`)
          .join("");
      }
      function refreshMatSelects() {
        const opts = '<option value="">Selecionar</option>' + getMatOpts();
        ["a-mat", "p-mat"].forEach((id) => {
          document.getElementById(id).innerHTML = opts;
        });
        document.getElementById("pomo-mat").innerHTML =
          '<option value="">Nenhuma</option>' + getMatOpts();
      }
      function getMatNome(id) {
        const m = data.materias.find((x) => x.id === id);
        return m ? m.nome : "";
      }
      function getMatCor(id) {
        const m = data.materias.find((x) => x.id === id);
        return m ? corMap[m.cor] || corMap.blue : corMap.blue;
      }

      function diasAte(d) {
        if (!d) return null;
        const hoje = new Date();
        hoje.setHours(0, 0, 0, 0);
        const alvo = new Date(d + "T00:00:00");
        return Math.ceil((alvo - hoje) / (1000 * 60 * 60 * 24));
      }
      function fmtData(d) {
        if (!d) return "";
        const [a, m, dia] = d.split("-");
        return `${dia}/${m}/${a}`;
      }
      function urgBadge(dias) {
        if (dias === null) return '<span class="badge gray">Sem data</span>';
        if (dias < 0) return '<span class="badge gray">Encerrado</span>';
        if (dias === 0) return '<span class="badge red">Hoje!</span>';
        if (dias <= 3) return `<span class="badge red">${dias}d</span>`;
        if (dias <= 7) return `<span class="badge yellow">${dias}d</span>`;
        return `<span class="badge blue">${dias}d</span>`;
      }
      function prioBadge(p) {
        return (
          {
            alta: '<span class="badge red">Alta</span>',
            media: '<span class="badge yellow">Média</span>',
            baixa: '<span class="badge gray">Baixa</span>',
          }[p] || ""
        );
      }

      function addAtividade() {
        const nome = document.getElementById("a-nome").value.trim();
        if (!nome) return;
        data.atividades.push({
          id: uid(),
          nome,
          mat: document.getElementById("a-mat").value,
          data: document.getElementById("a-data").value,
          prio: document.getElementById("a-prio").value,
          done: false,
        });
        document.getElementById("a-nome").value = "";
        save();
        renderAtividades();
      }
      function renderAtividades() {
        const el = document.getElementById("lista-atividades");
        const items = data.atividades
          .filter((a) => !a.done)
          .sort(
            (a, b) =>
              (({ alta: 0, media: 1, baixa: 2 })[a.prio] || 1) -
              ({ alta: 0, media: 1, baixa: 2 }[b.prio] || 1),
          );
        if (!items.length) {
          el.innerHTML =
            '<div class="empty"><i class="ti ti-calendar-off"></i>Nenhuma atividade pendente</div>';
          return;
        }
        el.innerHTML = items
          .map(
            (a) => `<div class="card">
    <input type="checkbox" style="width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0" onchange="doneAtiv('${a.id}')">
    <div class="card-body">
      <div class="card-title">${a.nome}</div>
      <div class="card-sub">${getMatNome(a.mat) ? '<span class="tag">' + getMatNome(a.mat) + "</span>" : ""} ${a.data ? fmtData(a.data) : ""}</div>
    </div>
    ${prioBadge(a.prio)} ${urgBadge(diasAte(a.data))}
    <button class="btn danger small" onclick="delAtiv('${a.id}')"><i class="ti ti-trash"></i></button>
  </div>`,
          )
          .join("");
      }
      function doneAtiv(id) {
        data.atividades = data.atividades.map((a) =>
          a.id === id ? { ...a, done: true } : a,
        );
        save();
        renderAtividades();
      }
      function delAtiv(id) {
        data.atividades = data.atividades.filter((a) => a.id !== id);
        save();
        renderAtividades();
      }

      function addProva() {
        const nome = document.getElementById("p-nome").value.trim();
        if (!nome) return;
        data.provas.push({
          id: uid(),
          nome,
          mat: document.getElementById("p-mat").value,
          data: document.getElementById("p-data").value,
          peso: document.getElementById("p-peso").value || 0,
          feita: false,
        });
        document.getElementById("p-nome").value = "";
        document.getElementById("p-peso").value = "";
        save();
        renderProvas();
      }
      function renderProvas() {
        const el = document.getElementById("lista-provas");
        const items = data.provas
          .filter((p) => !p.feita)
          .sort(
            (a, b) => new Date(a.data || "9999") - new Date(b.data || "9999"),
          );
        if (!items.length) {
          el.innerHTML =
            '<div class="empty"><i class="ti ti-writing-off"></i>Nenhuma prova cadastrada</div>';
          return;
        }
        el.innerHTML = items
          .map(
            (p) => `<div class="card">
    <div class="card-body">
      <div class="card-title">${p.nome}</div>
      <div class="card-sub">${getMatNome(p.mat) ? '<span class="tag">' + getMatNome(p.mat) + "</span>" : ""} ${p.data ? fmtData(p.data) : ""} ${p.peso ? "• Peso: " + p.peso + "%" : ""}</div>
    </div>
    ${urgBadge(diasAte(p.data))}
    <button class="btn success small" onclick="feitaProva('${p.id}')"><i class="ti ti-check"></i>Feita</button>
    <button class="btn danger small" onclick="delProva('${p.id}')"><i class="ti ti-trash"></i></button>
  </div>`,
          )
          .join("");
      }
      function feitaProva(id) {
        data.provas = data.provas.map((p) =>
          p.id === id ? { ...p, feita: true } : p,
        );
        save();
        renderProvas();
      }
      function delProva(id) {
        data.provas = data.provas.filter((p) => p.id !== id);
        save();
        renderProvas();
      }

      function addMateria() {
        const nome = document.getElementById("m-nome").value.trim();
        if (!nome) return;
        data.materias.push({
          id: uid(),
          nome,
          cor: document.getElementById("m-cor").value,
          meta: parseInt(document.getElementById("m-meta").value) || 5,
        });
        document.getElementById("m-nome").value = "";
        document.getElementById("m-meta").value = "";
        if (!data.horasHoje) data.horasHoje = {};
        save();
        renderMaterias();
        refreshMatSelects();
      }
      function renderMaterias() {
        const el = document.getElementById("lista-materias");
        if (!data.materias.length) {
          el.innerHTML =
            '<div class="empty"><i class="ti ti-books"></i>Nenhuma matéria cadastrada</div>';
          return;
        }
        el.innerHTML = data.materias
          .map((m) => {
            const h = data.horasHoje[m.id] || 0;
            const meta = m.meta || 5;
            const pct = Math.min(100, Math.round((h / meta) * 100));
            const cor = corMap[m.cor] || corMap.blue;
            return `<div class="mat-row">
      <div class="mat-header">
        <span class="mat-dot" style="background:${cor}"></span>
        <span style="font-size:13px;font-weight:500;flex:1">${m.nome}</span>
        <span style="font-size:12px;color:var(--text2)">${h}h / ${meta}h meta semanal</span>
        <button class="btn small" onclick="addHora('${m.id}',-0.5)" style="padding:3px 8px">-30min</button>
        <button class="btn small" onclick="addHora('${m.id}',0.5)" style="padding:3px 8px">+30min</button>
        <button class="btn danger small" onclick="delMateria('${m.id}')"><i class="ti ti-trash"></i></button>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${cor}"></div></div>
      <div style="font-size:11px;color:var(--text2);margin-top:3px">${pct}% da meta</div>
    </div>`;
          })
          .join("");
      }
      function addHora(id, delta) {
        if (!data.horasHoje) data.horasHoje = {};
        data.horasHoje[id] = Math.max(0, (data.horasHoje[id] || 0) + delta);
        save();
        renderMaterias();
      }
      function delMateria(id) {
        data.materias = data.materias.filter((m) => m.id !== id);
        if (data.horasHoje) delete data.horasHoje[id];
        save();
        renderMaterias();
        refreshMatSelects();
      }

      // POMODORO
      let pomoTimer = null,
        pomoSec = 25 * 60,
        pomoRunning = false,
        pomoCiclo = 0,
        pomoFoco = true,
        pomoBase = 25 * 60;
      function pomoFmt(s) {
        const m = Math.floor(s / 60),
          ss = s % 60;
        return String(m).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
      }
      function pomoTick() {
        if (pomoSec > 0) {
          pomoSec--;
          document.getElementById("pomo-display").textContent =
            pomoFmt(pomoSec);
        } else {
          clearInterval(pomoTimer);
          pomoTimer = null;
          pomoRunning = false;
          document.getElementById("pomo-btn").innerHTML =
            '<i class="ti ti-player-play"></i>Iniciar';
          if (pomoFoco) {
            pomoCiclo++;
            if (pomoCiclo >= 4) {
              pomoCiclo = 0;
              pomoSec = 15 * 60;
              document.getElementById("pomo-fase").textContent = "Pausa longa";
            } else {
              pomoSec = 5 * 60;
              document.getElementById("pomo-fase").textContent = "Pausa curta";
            }
          } else {
            pomoSec = pomoBase;
            document.getElementById("pomo-fase").textContent = "Foco";
          }
          pomoFoco = !pomoFoco;
          document.getElementById("pomo-sessao").textContent = Math.min(
            pomoCiclo + 1,
            4,
          );
          document.getElementById("pomo-display").textContent =
            pomoFmt(pomoSec);
        }
      }
      function pomoToggle() {
        if (pomoRunning) {
          clearInterval(pomoTimer);
          pomoTimer = null;
          pomoRunning = false;
          document.getElementById("pomo-btn").innerHTML =
            '<i class="ti ti-player-play"></i>Iniciar';
        } else {
          pomoTimer = setInterval(pomoTick, 1000);
          pomoRunning = true;
          document.getElementById("pomo-btn").innerHTML =
            '<i class="ti ti-player-pause"></i>Pausar';
        }
      }
      function pomoReset() {
        clearInterval(pomoTimer);
        pomoTimer = null;
        pomoRunning = false;
        pomoCiclo = 0;
        pomoFoco = true;
        pomoSec = pomoBase;
        document.getElementById("pomo-display").textContent = pomoFmt(pomoSec);
        document.getElementById("pomo-fase").textContent = "Foco";
        document.getElementById("pomo-sessao").textContent = "1";
        document.getElementById("pomo-btn").innerHTML =
          '<i class="ti ti-player-play"></i>Iniciar';
      }
      function pomoAjuste(min) {
        if (pomoRunning) return;
        pomoBase = Math.max(5 * 60, pomoBase + min * 60);
        pomoSec = pomoBase;
        document.getElementById("pomo-display").textContent = pomoFmt(pomoSec);
      }
      function addPomoTask() {
        const v = document.getElementById("pomo-nova").value.trim();
        if (!v) return;
        data.pomoTasks.push({ id: uid(), texto: v, done: false });
        document.getElementById("pomo-nova").value = "";
        save();
        renderPomoTasks();
      }
      function renderPomoTasks() {
        const el = document.getElementById("pomo-checklist");
        if (!data.pomoTasks.length) {
          el.innerHTML =
            '<div style="font-size:13px;color:var(--text2);padding:4px 0">Nenhuma tarefa ainda</div>';
          return;
        }
        el.innerHTML = data.pomoTasks
          .map(
            (t) => `
    <div class="check-item${t.done ? " done" : ""}">
      <input type="checkbox" id="pt-${t.id}" ${t.done ? "checked" : ""} onchange="togglePomoTask('${t.id}')">
      <label for="pt-${t.id}">${t.texto}</label>
      <button class="btn danger small" onclick="delPomoTask('${t.id}')"><i class="ti ti-x"></i></button>
    </div>`,
          )
          .join("");
      }
      function togglePomoTask(id) {
        data.pomoTasks = data.pomoTasks.map((t) =>
          t.id === id ? { ...t, done: !t.done } : t,
        );
        save();
        renderPomoTasks();
      }
      function delPomoTask(id) {
        data.pomoTasks = data.pomoTasks.filter((t) => t.id !== id);
        save();
        renderPomoTasks();
      }

      function renderDash() {
        const pending = data.atividades.filter((a) => !a.done).length;
        const provas = data.provas
          .filter((p) => !p.feita)
          .sort(
            (a, b) => new Date(a.data || "9999") - new Date(b.data || "9999"),
          );
        const totalH = Object.values(data.horasHoje || {}).reduce(
          (s, v) => s + v,
          0,
        );
        document.getElementById("dash-metrics").innerHTML = `
    <div class="metric blue"><div class="metric-val">${pending}</div><div class="metric-lbl">Atividades</div></div>
    <div class="metric red"><div class="metric-val">${provas.length}</div><div class="metric-lbl">Provas</div></div>
    <div class="metric green"><div class="metric-val">${totalH.toFixed(1)}h</div><div class="metric-lbl">Hoje</div></div>
    <div class="metric yellow"><div class="metric-val">${data.materias.length}</div><div class="metric-lbl">Matérias</div></div>`;
        const dp = document.getElementById("dash-provas");
        dp.innerHTML =
          provas
            .slice(0, 3)
            .map(
              (p) => `<div class="card" style="margin-bottom:8px">
    <div class="card-body"><div class="card-title">${p.nome}</div>
    <div class="card-sub">${getMatNome(p.mat) ? '<span class="tag">' + getMatNome(p.mat) + "</span>" : ""} ${fmtData(p.data)}</div></div>
    ${urgBadge(diasAte(p.data))}</div>`,
            )
            .join("") ||
          '<div style="font-size:13px;color:var(--text2)">Nenhuma prova próxima</div>';
        const da = document.getElementById("dash-ativ");
        da.innerHTML =
          data.atividades
            .filter((a) => !a.done)
            .slice(0, 3)
            .map(
              (a) => `<div class="card" style="margin-bottom:8px">
    <div class="card-body"><div class="card-title">${a.nome}</div>
    <div class="card-sub">${getMatNome(a.mat) ? '<span class="tag">' + getMatNome(a.mat) + "</span>" : ""} ${fmtData(a.data)}</div></div>
    ${prioBadge(a.prio)}</div>`,
            )
            .join("") ||
          '<div style="font-size:13px;color:var(--text2)">Nenhuma atividade</div>';
        const dm = document.getElementById("dash-materias");
        dm.innerHTML =
          data.materias
            .map((m) => {
              const h = data.horasHoje[m.id] || 0;
              const cor = corMap[m.cor] || corMap.blue;
              return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span style="font-size:13px;min-width:120px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.nome}</span>
      <div style="flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${Math.min(100, Math.round(((h || 0) / m.meta) * 100))}%;background:${cor};border-radius:4px"></div></div>
      <span style="font-size:12px;color:var(--text2);min-width:36px;text-align:right">${h}h</span></div>`;
            })
            .join("") ||
          '<div style="font-size:13px;color:var(--text2)">Nenhuma matéria</div>';
      }

      // INIT
      refreshMatSelects();
      renderAtividades();
      renderProvas();
      renderMaterias();
      renderPomoTasks();
      document.getElementById("a-data").valueAsDate = new Date();
      document.getElementById("p-data").valueAsDate = new Date();
    </script>
  </body>
</html>
